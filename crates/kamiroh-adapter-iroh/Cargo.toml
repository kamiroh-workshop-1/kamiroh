[package]
name = "kamiroh-adapter-iroh"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "kamiroh transport adapter: conversations over Iroh connections"

[dependencies]
kamiroh-domain = { workspace = true, features = ["serde"] }
kamiroh-ports.workspace = true
# Version assumptions — first local build pass: bump to latest, fix API drift
# per the notes at the top of src/lib.rs.
iroh = "1"
postcard = { version = "1", features = ["use-std"] }
serde = { version = "1", features = ["derive"] }
tokio = { version = "1", features = ["rt", "macros", "sync"] }

[dev-dependencies]
kamiroh-app.workspace = true
kamiroh-adapter-kameo.workspace = true
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
